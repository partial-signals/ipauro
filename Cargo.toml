[workspace]
resolver = "3"
members = [
    "crates/ipauro-proto",
    "crates/ipauro-xpc",
    "crates/ipauro-core",
    "crates/ipauro-cli",
    "crates/ipauro-probe",
    "app/helper",
    "app/ui",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/yah-ai/ipauro"

[workspace.dependencies]
ipauro-proto = { path = "crates/ipauro-proto" }
ipauro-xpc = { path = "crates/ipauro-xpc" }
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
] }

[profile.release]
lto = "thin"
